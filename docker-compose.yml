# ══════════════════════════════════════════════════════════════════
#  Lotería de Animales — Stack completo
#  Servicios: traefik · db (MariaDB) · backend (WordPress) · frontend (Next.js)
#
#  Redes:
#    web-network  → red externa de Traefik (ya existe en el VPS)
#    loteria-net  → red privada interna (db ↔ backend ↔ frontend)
#
#  Secrets requeridos en .env.production (NO commitear):
#    MYSQL_ROOT_PASSWORD, MYSQL_PASSWORD, MYSQL_USER, MYSQL_DATABASE
#    NEXT_PUBLIC_API_URL, ACME_EMAIL, REVALIDATE_SECRET, etc.
# ══════════════════════════════════════════════════════════════════

services:

  # ──────────────────────────────────────────────────────────────
  #  TRAEFIK v3 — Proxy Inverso + SSL automático (Let's Encrypt)
  #  Único servicio con puertos expuestos al host (80 y 443).
  # ──────────────────────────────────────────────────────────────
  traefik:
    image: traefik:v3.6.1
    restart: unless-stopped
    environment:
      # FIX: el cliente Go de Traefik negocia API v1.24 por defecto.
      # Docker Engine 25+ requiere mínimo v1.44 — sin esto Traefik no
      # puede leer labels de contenedores y cae al certificado self-signed.
      DOCKER_API_VERSION: "1.44"
    ports:
      - "80:80"
      - "443:443"
    command:
      - "--api.dashboard=true"
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=web-network"
      - "--providers.docker.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # ── Let's Encrypt HTTP-01 ──────────────────────────────────
      # El challenge HTTP-01 responde en /.well-known/acme-challenge/
      # ANTES de que los middlewares de redirect corran — no interfiere
      # con el redirect HTTP→HTTPS de las otras rutas.
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      # ── Logs ────────────────────────────────────────────────────
      - "--log.level=INFO"
      - "--accesslog=true"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "letsencrypt_data:/letsencrypt"
    networks:
      - web-network
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


  # ──────────────────────────────────────────────────────────────
  #  BASE DE DATOS — MariaDB 10.11
  #  Solo accesible desde la red interna. Nunca expuesta al exterior.
  # ──────────────────────────────────────────────────────────────
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE:      ${MYSQL_DATABASE:-wordpress}
      MYSQL_USER:          ${MYSQL_USER:-wpuser}
      MYSQL_PASSWORD:      ${MYSQL_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - loteria-net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      interval: 15s
      timeout: 5s
      retries: 5


  # ──────────────────────────────────────────────────────────────
  #  BACKEND — WordPress PHP 8.2 + Apache
  #  Accede a db por red interna. Nunca expone puerto al host.
  # ──────────────────────────────────────────────────────────────
  backend:
    image: wordpress:php8.2-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST:     db:3306
      WORDPRESS_DB_NAME:     ${MYSQL_DATABASE:-wordpress}
      WORDPRESS_DB_USER:     ${MYSQL_USER:-wpuser}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_TABLE_PREFIX: wp_
      WORDPRESS_CONFIG_EXTRA: >-
        define('WP_HOME',    '${WP_HOME_URL}');
        define('WP_SITEURL', '${WP_HOME_URL}');
        define('FORCE_SSL_ADMIN', true);
        define('WP_ENVIRONMENT_TYPE', 'production');
        define('LA_NEXTJS_URL',        '${LA_NEXTJS_URL}');
        define('LA_REVALIDATE_SECRET', '${REVALIDATE_SECRET}');
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
          $$_SERVER['HTTPS'] = 'on';
        }
    volumes:
      - wp_content:/var/www/html/wp-content
    expose:
      - "80"
    networks:
      - web-network
      - loteria-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/ > /dev/null || exit 1"]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web-network"
      - "traefik.http.services.backend-svc.loadbalancer.server.port=80"

      # ── Middleware CORS ────────────────────────────────────────
      - "traefik.http.middlewares.cors-api.headers.customresponseheaders.Access-Control-Allow-Origin=${CORS_ALLOW_ORIGIN}"
      - "traefik.http.middlewares.cors-api.headers.customresponseheaders.Access-Control-Allow-Methods=GET, POST, OPTIONS"
      - "traefik.http.middlewares.cors-api.headers.customresponseheaders.Access-Control-Allow-Headers=Content-Type, Authorization, X-WP-Nonce"

      # ── STAGING ────────────────────────────────────────────────
      - "traefik.http.routers.backend-staging-http.rule=Host(`backoffice.187.77.251.126.nip.io`)"
      - "traefik.http.routers.backend-staging-http.entrypoints=web"
      - "traefik.http.routers.backend-staging-http.middlewares=redirect-to-https@docker"

      - "traefik.http.routers.backend-staging-https.rule=Host(`backoffice.187.77.251.126.nip.io`)"
      - "traefik.http.routers.backend-staging-https.entrypoints=websecure"
      - "traefik.http.routers.backend-staging-https.tls=true"
      - "traefik.http.routers.backend-staging-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.backend-staging-https.service=backend-svc"
      - "traefik.http.routers.backend-staging-https.middlewares=cors-api"

      # ── PRODUCCIÓN (descomentar cuando el DNS esté apuntado) ───
      # - "traefik.http.routers.backend-http.rule=Host(`api.loteriadeanimales.com.py`)"
      # - "traefik.http.routers.backend-http.entrypoints=web"
      # - "traefik.http.routers.backend-http.middlewares=redirect-to-https@docker"
      #
      # - "traefik.http.routers.backend-https.rule=Host(`api.loteriadeanimales.com.py`)"
      # - "traefik.http.routers.backend-https.entrypoints=websecure"
      # - "traefik.http.routers.backend-https.tls=true"
      # - "traefik.http.routers.backend-https.tls.certresolver=letsencrypt"
      # - "traefik.http.routers.backend-https.service=backend-svc"
      # - "traefik.http.routers.backend-https.middlewares=cors-api"


  # ──────────────────────────────────────────────────────────────
  #  FRONTEND — Next.js 15 (output: standalone)
  # ──────────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL:    ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SITE_URL:   ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_WP_URL:     ${NEXT_PUBLIC_WP_URL}
        NEXT_PUBLIC_LOGIN_URL:  ${NEXT_PUBLIC_LOGIN_URL}
    image: loteria-frontend:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      WORDPRESS_INTERNAL_URL: http://backend/wp-json/la/v1
    expose:
      - "3000"
    networks:
      - web-network
      - loteria-net
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/',r=>process.exit(r.statusCode<400?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web-network"
      - "traefik.http.services.frontend-svc.loadbalancer.server.port=3000"

      # ── Middleware global: HTTP → HTTPS ────────────────────────
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"

      # ── STAGING ────────────────────────────────────────────────
      - "traefik.http.routers.frontend-staging-http.rule=Host(`staging.187.77.251.126.nip.io`)"
      - "traefik.http.routers.frontend-staging-http.entrypoints=web"
      - "traefik.http.routers.frontend-staging-http.middlewares=redirect-to-https"

      - "traefik.http.routers.frontend-staging-https.rule=Host(`staging.187.77.251.126.nip.io`)"
      - "traefik.http.routers.frontend-staging-https.entrypoints=websecure"
      - "traefik.http.routers.frontend-staging-https.tls=true"
      - "traefik.http.routers.frontend-staging-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.frontend-staging-https.service=frontend-svc"

      # ── PRODUCCIÓN (descomentar cuando el DNS esté apuntado) ───
      # - "traefik.http.routers.frontend-http.rule=Host(`loteriadeanimales.com.py`) || Host(`www.loteriadeanimales.com.py`)"
      # - "traefik.http.routers.frontend-http.entrypoints=web"
      # - "traefik.http.routers.frontend-http.middlewares=redirect-to-https"
      #
      # - "traefik.http.routers.frontend-https.rule=Host(`loteriadeanimales.com.py`) || Host(`www.loteriadeanimales.com.py`)"
      # - "traefik.http.routers.frontend-https.entrypoints=websecure"
      # - "traefik.http.routers.frontend-https.tls=true"
      # - "traefik.http.routers.frontend-https.tls.certresolver=letsencrypt"
      # - "traefik.http.routers.frontend-https.service=frontend-svc"
      # - "traefik.http.routers.frontend-https.tls.domains[0].main=loteriadeanimales.com.py"
      # - "traefik.http.routers.frontend-https.tls.domains[0].sans=www.loteriadeanimales.com.py"


# ══════════════════════════════════════════════════════════════════
#  REDES
# ══════════════════════════════════════════════════════════════════
networks:
  web-network:
    external: true

  loteria-net:
    driver: bridge
    internal: true


# ══════════════════════════════════════════════════════════════════
#  VOLÚMENES
# ══════════════════════════════════════════════════════════════════
volumes:
  mariadb_data:
    driver: local

  wp_content:
    driver: local

  letsencrypt_data:
    driver: local
